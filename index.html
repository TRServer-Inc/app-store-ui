<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppVault - Uygulama Mağazası</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #334155;
            margin-bottom: 30px;
        }

        h1 {
            color: #38bdf8;
            font-size: 1.8rem;
        }

        .status-badge {
            padding: 6px 12px;
            background-color: #10b981;
            color: #fff;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .app-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .app-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            object-fit: cover;
            background-color: #334155;
        }

        .app-info h3 {
            font-size: 1.1rem;
            color: #f1f5f9;
        }

        .app-info p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .versions-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            border: 1px solid #334155;
        }

        .action-buttons {
            display: flex;
            gap: 12px; /* Butonlar arasındaki o şık boşluk */
        }

        .install-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            transition: opacity 0.2s;
            border: none;
            color: #fff;
        }

        .install-btn:hover {
            opacity: 0.85;
        }

        .btn-ios {
            background-color: #0284c7;
        }

        .btn-windows {
            background-color: #2563eb;
        }

        .download-count {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 10px;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1>appvault store</h1>
        <div class="status-badge" id="status">backend aktif</div>
    </header>

    <div class="app-grid" id="appGrid">
        <!-- Uygulamalar dinamik yüklenecek -->
    </div>

    <script>
        const RENDER_SERVICE_URL = "https://app-store-backend-p6jo.onrender.com";

        async function fetchApps() {
            try {
                const res = await fetch(`${RENDER_SERVICE_URL}/api/apps`);
                const apps = await res.json();
                renderApps(apps);
            } catch (err) {
                console.error("Uygulamalar yüklenemedi:", err);
                document.getElementById('status').innerText = 'bağlantı hatası';
                document.getElementById('status').style.backgroundColor = '#ef4444';
            }
        }

        function renderApps(apps) {
            const grid = document.getElementById('appGrid');
            grid.innerHTML = '';

            if (!apps || apps.length === 0) {
                grid.innerHTML = '<p style="color:#94a3b8;">henüz eklenmiş bir uygulama bulunmuyor.</p>';
                return;
            }

            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';

                // iOS OTA Manifest Linki Oluşturma
                const manifestUrl = encodeURIComponent(`${RENDER_SERVICE_URL}/manifest?title=${encodeURIComponent(app.name)}&bundleId=${app.ios.bundleId}&version=${app.ios.version}&ipa=${encodeURIComponent(app.ios.ipaUrl)}`);
                const itmsUrl = `itms-services://?action=download-manifest&url=${manifestUrl}`;

                card.innerHTML = `
                    <div>
                        <div class="app-header">
                            <img src="${app.iconUrl}" class="app-icon" alt="${app.name}" onerror="this.src='https://via.placeholder.com/60'">
                            <div class="app-info">
                                <h3>${app.name}</h3>
                                <p>${app.description}</p>
                            </div>
                        </div>
                        <div class="versions-box">
                            <span><b>Win:</b> v${app.windows.version}</span>
                            <span><b>iOS:</b> v${app.ios.version}</span>
                        </div>
                    </div>
                    <div>
                        <span class="download-count">Toplam İndirme: <span id="count-${app.id}">${app.downloads || 0}</span></span>
                        <div class="action-buttons">
                            <a href="${app.windows.downloadUrl}" class="install-btn btn-windows" onclick="trackDownload('${app.id}')" download>Windows İndir</a>
                            <a href="${itmsUrl}" class="install-btn btn-ios" onclick="trackDownload('${app.id}')">iOS Yükle</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function trackDownload(appId) {
            try {
                const res = await fetch(`${RENDER_SERVICE_URL}/api/download/${appId}`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    const el = document.getElementById(`count-${appId}`);
                    if (el) el.innerText = data.downloads;
                }
            } catch (e) {
                console.error("Sayaç güncellenemedi", e);
            }
        }

        fetchApps();
    </script>
</body>
</html>
